name: Hello

on: [push, workflow_dispatch]

jobs:
    hello-world:
        runs-on: ubuntu-26.04
        steps:
            - name: Say hello
              run: echo "Hello, world!"

            - name: Check time
              run: date
    
    repo-files:
      runs-on: ubuntu-26.04
      steps:
        - name: Download repo
          uses: actions/checkout@v7
        - name: List files
          run: ls -la

