name: Update flake

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  update-flake:
    runs-on: ubuntu-22.04
    permissions: 
      contents: write
      pull-requests: write

    steps:
      - name: Download repo
        uses: actions/checkout@v7

      - name: Install nix
        uses: DeterminateSystems/determinate-nix-action@v3 

      - name: Add cachix for hyprland
        uses: cachix/cachix-action@v14
        with:
          name: hyprland

      - name: Update flake.lock
        run: nix flake update

      - name: Check flake
        run: nix flake check

      - name: Build for all hosts
        run: |
          for host in hosts/*/; do
            host=${host%/}
            host=${host#hosts/}
            [[ $host == "example" ]] && continue
            echo "Building $host"
            nix build --no-link ".#nixosConfigurations.$host.config.system.build.toplevel"
          done


      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(deps): update flake.lock"
          branch: chore/update-flake-lock
          title: Update flake.lock
          body: |
            Update flake.lock
            Ran nix flake update and ran `nix flake check` and built for all hosts.
            - Auto-generated by [create-pull-request](https://github.com/marketplace/actions/create-pull-request?version=v8)

          labels: |
            automated pr 
            flake.lock update

        



